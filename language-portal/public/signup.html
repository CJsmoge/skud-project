<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Записаться — LinguaPro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="container header-inner">
      <a href="index.html" class="logo">🌍 LinguaPro</a>
      <nav>
        <a href="index.html">Главная</a>
        <a href="courses.html">Курсы</a>
        <a href="signup.html" class="btn active">Записаться</a>
      </nav>
    </div>
  </header>

  <section class="section">
    <div class="container" style="max-width: 600px;">
      <div class="card" style="padding: 40px;">
        <h2 style="text-align: center; margin-bottom: 10px;">Записаться на урок</h2>
        <p style="text-align: center; color: #6b7280; margin-bottom: 30px;">Оставьте заявку, и мы свяжемся с вами.</p>

        <form id="signupForm" novalidate>
          <div class="form-group">
            <label>ФИО:</label>
            <input id="fullName" type="text" placeholder="Иванов Иван">
            <div class="error-text" id="err-fullName" style="color: red; font-size: 14px;"></div>
          </div>
          <div class="form-group">
            <label>Телефон:</label>
            <input id="phone" type="tel" placeholder="+7(999)-123-45-67">
            <div class="error-text" id="err-phone" style="color: red; font-size: 14px;"></div>
          </div>
          <div class="form-group">
            <label>Email:</label>
            <input id="email" type="email" placeholder="ivan@mail.ru">
            <div class="error-text" id="err-email" style="color: red; font-size: 14px;"></div>
          </div>
          <div class="form-group">
            <label>Выберите курс:</label>
            <select id="courseId">
              <option value="">-- Выберите --</option>
            </select>
            <div class="error-text" id="err-courseId" style="color: red; font-size: 14px;"></div>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="agree">
            <label for="agree" style="margin: 0; font-weight: normal;">Я согласен на обработку персональных данных</label>
          </div>
          <div class="error-text" id="err-agree" style="color: red; font-size: 14px; margin-bottom: 15px;"></div>
          
          <button type="submit" class="btn" style="width: 100%;">Записаться</button>
        </form>

        <div id="success" style="display: none; color: green; font-weight: bold; text-align: center; margin-top: 20px;">
          Заявка успешно отправлена! Мы свяжемся с вами.
        </div>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>© 2026 LinguaPro. Все права защищены.</p>
    </div>
  </footer>

  <script src="js/signup.js"></script>
</body>
</html>
