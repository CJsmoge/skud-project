<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Записаться — LinguaPro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="container header-inner">
      <a href="index.html" class="logo">🌍 LinguaPro</a>
      <nav>
        <a href="index.html">Главная</a>
        <a href="courses.html">Курсы</a>
        <a href="signup.html" class="btn active">Записаться</a>
      </nav>
    </div>
  </header>

  <section class="section">
    <div class="container" style="max-width: 600px;">
      <div class="card" style="padding: 40px;">
        <h2 style="text-align: center; margin-bottom: 10px;">Записаться на урок</h2>
        <p style="text-align: center; color: #6b7280; margin-bottom: 30px;">Оставьте заявку, и мы свяжемся с вами.</p>

        <form onsubmit="event.preventDefault(); alert('Заявка успешно отправлена!');">
          <div class="form-group">
            <label>ФИО:</label>
            <input type="text" placeholder="Иванов Иван" required>
          </div>
          <div class="form-group">
            <label>Телефон:</label>
            <input type="tel" placeholder="+7(999)-123-45-67" required pattern="\+7\(\d{3}\)-\d{3}-\d{2}-\d{2}" title="Формат: +7(XXX)-XXX-XX-XX">
          </div>
          <div class="form-group">
            <label>Email:</label>
            <input type="email" placeholder="ivan@mail.ru" required>
          </div>
          <div class="form-group">
            <label>Выберите курс:</label>
            <select required>
              <option value="">-- Выберите --</option>
              <option>Английский</option>
              <option>Немецкий</option>
              <option>Французский</option>
            </select>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="agree" required>
            <label for="agree" style="margin: 0; font-weight: normal;">Я согласен на обработку персональных данных</label>
          </div>
          <button type="submit" class="btn" style="width: 100%;">Записаться</button>
        </form>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>© 2026 LinguaPro. Все права защищены.</p>
    </div>
  </footer>

</body>
</html>
